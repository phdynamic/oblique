<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblique Strategies</title>
<style>
  :root { --bg: #f4efe6; --ink: #1d1b18; --card: #fffdf8; --edge: #cfc6b4; --focus: #8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15140f; --ink: #f1ebdd; --card: #24221b; --edge: #4a4639; --focus: #e0b04a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2rem; padding: 1rem; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
  h1 { font-size: 1rem; letter-spacing: .25em; text-transform: uppercase; font-weight: normal; margin: 0; }
  /* Tarot art is 3:5, so the card is too. */
  .stage { perspective: 1200px; width: min(80vw, 300px); aspect-ratio: 3 / 5; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
  .card.face-up { transform: rotateY(180deg); }
  .card.gone { visibility: hidden; }
  /* The reel is a vertical strip of face-down cards that slides through a card-sized window. */
  .reel { position: absolute; inset: 0; overflow: hidden; border-radius: 12px; display: none; z-index: 1; }
  .reel.on { display: block; }
  #strip { height: 100%; } /* gives .reel-item a definite 100% height, so each card is exactly window-sized */
  .reel-item { height: 100%; margin-bottom: var(--gap); border: 2px solid var(--edge); border-radius: 12px; background: var(--card) center / cover no-repeat; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border: 2px solid var(--edge); border-radius: 12px; overflow: hidden; }
  .back { background: var(--card) center / cover no-repeat; }
  .front { background: var(--card); transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.2rem; padding: 8%; text-align: center; }
  .front .text { font-size: clamp(1.3rem, 5.5vw, 1.7rem); line-height: 1.35; }
  .front .name { font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; opacity: .65; }
  button { font: inherit; font-size: 1.05rem; padding: .7rem 2rem; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--ink); background: var(--ink); color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .sr { position: absolute; left: -9999px; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<h1>Oblique Strategies</h1>
<div class="stage">
  <div class="card" id="card">
    <div class="face back" id="back" aria-hidden="true"></div>
    <div class="face front"><div class="text" id="text"></div><div class="name" id="name"></div></div>
  </div>
  <div class="reel" id="reel" aria-hidden="true"><div id="strip"></div></div>
</div>
<button id="draw">Draw a card</button>
<!-- Screen readers hear the result here; the card itself is visual. -->
<p id="live" class="sr" aria-live="polite"></p>

<script src="tarot.js"></script>
<script>
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const card = document.getElementById('card'), back = document.getElementById('back');
  const textEl = document.getElementById('text'), nameEl = document.getElementById('name');
  const btn = document.getElementById('draw'), live = document.getElementById('live');
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const showBack = c => { back.style.backgroundImage = `url(${c.img})`; };

  // Preload every card face so the flip-through never flashes a blank back.
  TAROT.forEach(c => { new Image().src = c.img; });
  showBack(pick(TAROT));

  // Face-down cards go by showing only their Tarot art, never their strategy; the card the reel stops on
  // is the one whose strategy is revealed. Each Tarot card owns exactly one strategy.
  let last = null;
  function drawOne() {
    let c;
    do { c = pick(TAROT); } while (c === last); // never repeat the card just shown
    return (last = c);
  }

  // Slide a strip of face-down cards through the window, top-to-bottom or bottom-to-top at random,
  // easing out so it settles on the chosen card. Resolves once it has stopped.
  const reel = document.getElementById('reel'), strip = document.getElementById('strip');
  const GAP = 14, REEL_CARDS = 18, SPIN_MS = 3080;
  async function spin(chosen) {
    strip.getAnimations().forEach(a => a.cancel()); // drop the previous spin's held (fill: forwards) end state
    const down = Math.random() < 0.5;
    const seq = [];
    for (let i = 0; i < REEL_CARDS - 1; i++) {
      let c; do { c = pick(TAROT); } while (c === seq[i - 1] || c === chosen);
      seq.push(c);
    }
    // Downward travel ends on the top slot; upward travel ends on the bottom slot.
    if (down) seq.unshift(chosen); else seq.push(chosen);
    strip.replaceChildren(...seq.map(c => {
      const d = document.createElement('div');
      d.className = 'reel-item';
      d.style.backgroundImage = `url(${c.img})`;
      return d;
    }));
    reel.style.setProperty('--gap', GAP + 'px');
    reel.classList.add('on'); // must be visible before measuring: a display:none reel reports clientHeight 0
    const far = -(REEL_CARDS - 1) * (reel.clientHeight + GAP);
    const [from, to] = down ? [far, 0] : [0, far];
    await strip.animate([{ transform: `translateY(${from}px)` }, { transform: `translateY(${to}px)` }],
      { duration: SPIN_MS, easing: 'cubic-bezier(.33,1,.68,1)', fill: 'forwards' }).finished;
  }

  async function draw() {
    btn.disabled = true;
    // Remove the previous card instantly (no flip back) so nothing shows through the gaps in the reel.
    card.style.transition = 'none';
    card.classList.remove('face-up');
    card.classList.add('gone');
    card.offsetWidth;               // commit the un-flipped state before transitions come back
    card.style.transition = '';
    const c = drawOne();
    textEl.textContent = c.text;
    nameEl.textContent = c.name;
    live.textContent = `${c.name}: ${c.text}`;
    if (!REDUCED) {
      await spin(c);
      showBack(c);                 // the real card underneath now matches the one the reel stopped on
      card.classList.remove('gone');
      await wait(700);             // hold on the selected card before turning it over
      reel.classList.remove('on');
    } else {
      showBack(c);
      card.classList.remove('gone');
    }
    card.classList.add('face-up');
    btn.textContent = 'Draw another';
    btn.disabled = false;
  }
  btn.addEventListener('click', draw);
</script>
</body>
</html>
